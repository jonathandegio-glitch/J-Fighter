<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J-Fighter / Reference Character QA</title><style>body{font:16px system-ui;background:#121b25;color:white;margin:0;padding:20px}canvas{width:100%;max-width:980px;border:1px solid #64748b;background:#233342;image-rendering:pixelated}select,button{padding:10px;margin:5px;background:#24384d;color:white;border:1px solid #86a2ba;border-radius:6px}#report{font:13px monospace;white-space:pre-wrap}h1{font-size:23px}</style></head><body><h1>J-Fighter · Animation QA (Reference Art)</h1><p>Both fighters are cut from the supplied character sheets. This is an extraction/retiming preview, not a full original animation redraw.</p><label>Fighter <select id="fighter"><option value="bad-benny">Bad Benny</option><option value="solan">General H.H.</option></select></label><label>Animation <select id="state"></select></label><button id="flip">Flip</button><button id="speed">0.5×</button><button id="pause">Pause</button><button id="next">Next frame</button><canvas id="canvas" width="980" height="500"></canvas><pre id="report">Loading...</pre><script src="assets/bad-benny/manifest.js?v=041"></script><script src="assets/solan/manifest.js?v=041"></script><script>(()=>{const ms={'bad-benny':window.BAD_BENNY_MANIFEST,solan:window.SOLAN_MANIFEST};const im=new Image();const id=document.getElementById('fighter'),st=document.getElementById('state'),c=document.getElementById('canvas'),ctx=c.getContext('2d'),report=document.getElementById('report');let frame=0,time=0,last=0,flip=false,speed=1,paused=false;function load(){const m=ms[id.value];st.innerHTML='';for(const k in m.animation.rows){const op=document.createElement('option');op.value=k;op.textContent=k;st.appendChild(op)}frame=0;time=0;im.src='assets/'+id.value+'/run/sprite-sheet-alpha.webp?v=041'}id.onchange=load;st.onchange=()=>{frame=0;time=0};document.getElementById('flip').onclick=()=>flip=!flip;document.getElementById('speed').onclick=()=>{speed=speed===1?.5:1;document.getElementById('speed').textContent=speed===1?'0.5×':'1×'};document.getElementById('pause').onclick=()=>paused=!paused;document.getElementById('next').onclick=()=>{paused=true;frame=(frame+1)%ms[id.value].animation.rows[st.value].frames};function tick(ts){const dt=Math.min(.1,(ts-last)/1000||0);last=ts;const m=ms[id.value],row=m.animation.rows[st.value];if(!paused){time+=dt*speed;frame=Math.floor(time*(row.fps||8))%row.frames}ctx.fillStyle='#213445';ctx.fillRect(0,0,980,500);ctx.fillStyle='#667b70';ctx.fillRect(0,435,980,65);ctx.strokeStyle='#dfdda0';ctx.beginPath();ctx.moveTo(0,435);ctx.lineTo(980,435);ctx.stroke();if(im.complete&&im.naturalWidth){const f=m.frame_layout.rows[st.value][frame];if(f){ctx.save();ctx.translate(490,435);ctx.scale(flip?-2.1:2.1,2.1);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,f.x,f.y,f.w,f.h,-224,-280,448,288);ctx.restore()}}report.textContent=JSON.stringify({fighter:id.value,state:st.value,frame:frame+1,frameCount:row.frames,image:im.naturalWidth+' x '+im.naturalHeight,manifest:!!m},null,2);requestAnimationFrame(tick)}im.onerror=()=>report.textContent='SPRITE 404: '+im.src;load();requestAnimationFrame(tick)})();</script></body></html>
