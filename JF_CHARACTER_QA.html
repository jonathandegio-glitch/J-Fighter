<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J-Fighter Character Lab · Bad Benny</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1420;color:#ebefe8;font:16px system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid #435065}h1{font-size:20px;margin:0 0 4px}small{color:#b4c4d4}main{max-width:1150px;margin:auto;padding:20px;display:grid;gap:22px;grid-template-columns:minmax(270px,1.7fr) minmax(260px,1fr)}canvas{width:100%;height:auto;image-rendering:pixelated;border:1px solid #435065;background:#1d2635;border-radius:12px}.side{display:flex;flex-direction:column;gap:12px}button,select{font:inherit;border-radius:8px;padding:11px;background:#25344a;color:white;border:1px solid #596e83;cursor:pointer}button:hover{background:#39516e}label{display:block;margin:7px 0}#state{width:100%}#status{font-size:14px;color:#b6d1ce;white-space:pre-line}#diagnostics{font:12px ui-monospace,monospace;white-space:pre-wrap;background:#182335;padding:12px;border-radius:9px;max-height:280px;overflow:auto}img{max-width:100%;height:auto}a{color:#b9dffa}@media(max-width:800px){main{grid-template-columns:1fr}}</style></head><body>
<header><h1>J-Fighter · Bad Benny / Character Lab</h1><small>Independent sprite candidate · 15 animation states · 54 frames · NOT a release-ready fighter</small></header>
<main><section><canvas id="stage" width="920" height="520" aria-label="Animated character preview"></canvas><p id="status">Loading...</p><p>Sprite source: <a href="assets/bad-benny/run/sprite-sheet-alpha.webp">open atlas</a> · <a href="assets/bad-benny/qa/storyboard.jpg">full storyboard</a></p></section>
<section class="side"><div><label for="state">Animation</label><select id="state"></select></div><div><button id="slow">0.5× speed</button> <button id="normal">1× speed</button> <button id="pause">Pause / Play</button></div><div><button id="flip">Flip facing</button> <button id="next">Next frame</button></div><div><label><input type="checkbox" id="boxes" checked> Show frame bounds and ground line</label></div><p id="diagnostics" role="status">Awaiting sprite...</p></section></main>
<script src="assets/bad-benny/manifest.js"></script><script src="bad-benny.js"></script>
<script>
(()=>{'use strict';const sheet=new Image(),m=window.BAD_BENNY_MANIFEST,k=window.BAD_BENNY_METRICS;const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');const sel=document.querySelector('#state');let state='idle',flip=false,playing=true,speed=1,frame=0,last=performance.now(),elapsed=0;
for(const [name,row] of Object.entries(m.animation.rows)){const opt=document.createElement('option');opt.value=name;opt.textContent=`${name} · ${row.frames}f / ${row.fps}fps`;sel.append(opt);}sel.value='idle';
function draw(now){const dt=Math.min(.1,(now-last)/1000);last=now;const row=m.animation.rows[state];if(playing){elapsed+=dt*speed;frame=Math.floor(elapsed*row.fps)%row.frames;}
ctx.clearRect(0,0,920,520);const bg=ctx.createLinearGradient(0,0,0,520);bg.addColorStop(0,'#304258');bg.addColorStop(1,'#101720');ctx.fillStyle=bg;ctx.fillRect(0,0,920,520);ctx.fillStyle='#6d7777';ctx.fillRect(0,440,920,80);ctx.fillStyle='#4c5a5d';for(let i=0;i<920;i+=70)ctx.fillRect(i,440,2,80);
if(sheet.complete&&sheet.naturalWidth){const r=m.frame_layout.rows[state][frame];ctx.save();ctx.translate(460,440);ctx.scale(flip?-2:2,2);ctx.imageSmoothingEnabled=false;ctx.drawImage(sheet,r.x,r.y,r.w,r.h,-224,-280,448,288);ctx.restore();}
if(document.querySelector('#boxes').checked){ctx.strokeStyle='#96f2db';ctx.setLineDash([10,5]);ctx.strokeRect(460-70,440-180*2,140,360);ctx.beginPath();ctx.moveTo(0,440);ctx.lineTo(920,440);ctx.stroke();ctx.setLineDash([]);}
document.querySelector('#status').textContent=`${state} · frame ${frame+1}/${row.frames} · ${row.fps} fps · direction ${flip?'left':'right'}`;requestAnimationFrame(draw);}sel.onchange=()=>{state=sel.value;elapsed=0;frame=0;};document.querySelector('#slow').onclick=()=>speed=.5;document.querySelector('#normal').onclick=()=>speed=1;document.querySelector('#pause').onclick=()=>playing=!playing;document.querySelector('#flip').onclick=()=>flip=!flip;document.querySelector('#next').onclick=()=>{playing=false;frame=(frame+1)%m.animation.rows[state].frames;};
sheet.onload=()=>{const details={id:m.id,sprite:[sheet.naturalWidth,sheet.naturalHeight],states:Object.keys(m.animation.rows).length,frames:Object.values(m.animation.rows).reduce((n,r)=>n+r.frames,0),metrics:!!k,kit:!!window.BadBenny};document.querySelector('#diagnostics').textContent=JSON.stringify(details,null,2);};sheet.onerror=()=>document.querySelector('#diagnostics').textContent='IMAGE LOAD ERROR';sheet.src='assets/bad-benny/run/sprite-sheet-alpha.webp';requestAnimationFrame(draw);
})();
</script></body></html>
