<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J-Fighter Sprite QA • 0.3.2</title><style>
:root{color-scheme:dark}body{background:#0c1422;color:#eef6fa;font:16px system-ui,sans-serif;margin:0;padding:24px}main{max-width:1050px;margin:auto}h1{margin:0 0 10px}p{color:#b6c5d1}select,button{font:inherit;background:#21324a;color:white;border:1px solid #54789e;padding:9px 12px;border-radius:8px}.tools{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}#stage{background:linear-gradient(#1c263c 20%,#30374c 75%,#242b35);border:1px solid #54789e;width:100%;image-rendering:pixelated;aspect-ratio:16/9}#report{white-space:pre-wrap;background:#162439;border-radius:8px;padding:12px}</style></head><body><main><h1>J-Fighter • Sprite QA</h1><p>Animation preview at native fighter scale. Inspect walking, running, attacks, hurt, down, and recover before deploying. These are procedural sprite-repair frames, not finished hand-drawn animation.</p><div class="tools"><label>Fighter <select id="fighter"><option value="nib">Bad Benny</option><option value="solan">General H.H.</option></select></label><label>Animation <select id="state"></select></label><button id="pause">Pause</button><button id="next">Next frame</button></div><canvas id="stage" width="960" height="540"></canvas><pre id="report">Loading assets…</pre></main><script>
const order=['idle','walk','run','jump','doublejump','crouch','attack1','attack2','attack3','skill1','skill2','ultimate','hurt','down','recover'];
const sel=document.getElementById('state');for(const s of order){const o=document.createElement('option');o.value=s;o.textContent=s;sel.add(o);}let im=new Image(),character='nib',state='idle',frame=0,paused=false,ready=false,last=0;
function load(){ready=false;im=new Image();im.onload=()=>{ready=true;document.getElementById('report').textContent=`Loaded ${character} | ${im.naturalWidth} × ${im.naturalHeight} | ${state} | frame ${frame+1}/4`;};im.onerror=()=>document.getElementById('report').textContent='Sprite file missing: '+im.src;im.src=`assets/${character}/run/sprite-sheet-alpha.webp?v=032`;frame=0;}
document.getElementById('fighter').onchange=e=>{character=e.target.value;load()};sel.onchange=e=>{state=e.target.value;frame=0};document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Play':'Pause'};document.getElementById('next').onclick=()=>{paused=true;frame=(frame+1)%(state==='jump'||state==='doublejump'?1:4);document.getElementById('pause').textContent='Play'};
const ctx=document.getElementById('stage').getContext('2d');function tick(stamp){const delta=stamp-last;if(!paused&&delta>=145){frame=(frame+1)%(state==='jump'||state==='doublejump'?1:4);last=stamp;}const w=960,h=540;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#9db3c9';ctx.beginPath();ctx.moveTo(50,420);ctx.lineTo(910,420);ctx.stroke();if(ready){const row=order.indexOf(state);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,frame*448,row*288,448,288,256,140,448,288);document.getElementById('report').textContent=`${character} | ${state} | frame ${frame+1}/${state==='jump'||state==='doublejump'?1:4} | sheet ${im.naturalWidth} × ${im.naturalHeight}`;}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></body></html>
